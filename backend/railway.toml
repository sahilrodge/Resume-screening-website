# Railway service config for the FastAPI backend
# Deploy from the backend/ directory (or set Root Directory = backend in Railway UI)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

# Railway injects PORT automatically; entrypoint.sh reads it.
